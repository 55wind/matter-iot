/* Apple DESIGN.md(getdesign.md) 기준: 검정 글로벌 내비 + 하나의 어두운 장면, Sky Blue 하나, 그림자·그라데이션 없음 */
@font-face { font-family: "Pretendard"; src: local("Pretendard Variable"), url("fonts/PretendardVariable.woff2") format("woff2"); font-weight: 45 920; font-display: swap; }
:root { --black: #000000; --ink-on-dark: #ffffff; --muted: #aeaeb2; --muted-2: #8e8e93; --sky: #2997ff; --blue: #0066cc; --hair: #3a3a3c; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--black); color: var(--ink-on-dark); font-family: "Pretendard", system-ui, sans-serif; letter-spacing: -0.01em; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 24px; background: var(--black); border-bottom: 1px solid #1c1c1e; flex-wrap: wrap; }
header h1 { font-size: 20px; font-weight: 600; margin: 0; line-height: 1.2; }
.brand { margin-right: 16px; }
.tag { font-size: 13px; color: var(--muted); }
.clock { font-size: 32px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.out { color: var(--muted); font-size: 17px; margin-right: auto; font-variant-numeric: tabular-nums; }
.pill { font: inherit; font-size: 15px; padding: 8px 20px; border-radius: 9999px; cursor: pointer; border: 1px solid var(--sky); background: transparent; color: var(--sky); transition: transform .12s; }
.pill:active { transform: scale(0.95); }
.pill:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.pill.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
select.pill { appearance: none; background: transparent; }
select.pill option { color: #000; }
#conn.on { border-color: var(--muted-2); color: var(--muted); }
#mode { font-size: 14px; color: var(--muted); padding: 7px 14px; border-radius: 9999px; border: 1px solid var(--hair); }
#mode.board { color: var(--sky); border-color: var(--sky); }
main { flex: 1; min-height: 0; position: relative; overflow: hidden; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; font-family: "Pretendard", system-ui, sans-serif; }
#scene text { letter-spacing: -0.01em; }
.panel { fill: #2c2c2e; fill-opacity: .92; stroke: #3a3a3c; stroke-width: 1.5; }
.cap { fill: var(--muted); font-size: 19px; }
.val { fill: #fff; font-size: 104px; font-weight: 600; letter-spacing: -3px; font-variant-numeric: tabular-nums; }
.lbl { fill: var(--muted-2); font-size: 16px; }
.state { font-size: 23px; font-weight: 600; }
/* 장면 애니메이션 */
#blades { fill: #636366; transform-box: fill-box; transform-origin: center; }
.fan-on #blades { fill: var(--sky); animation: spin .45s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#air path { stroke-dasharray: 10 12; opacity: 0; }
.fan-on #air path { opacity: .9; animation: flow .6s linear infinite; }
@keyframes flow { to { stroke-dashoffset: 44; } }
#mist circle { opacity: 0; transform-box: fill-box; transform-origin: center; }
.hum-on #mist circle { animation: mist 2.4s ease-out infinite; }
@keyframes mist { 0% { transform: translateY(0) scale(.6); opacity: 0; } 25% { opacity: .8; } 100% { transform: translateY(-120px) scale(2); opacity: 0; } }
</style>

<script>
const $ = id => document.getElementById(id);

/* ---------- 가상 침실 (센서와 가전의 물리적 효과를 대신함) ---------- */
const P = { T_IN: 21, F0: 0.316, G_FAN: 1 / 3, TAU_WALL: 60, TAU_FAN: 0.5,
            AH_OUT: 2.5, TAU_VENT: 150, S_OCC: 0.015, G_HUM: 0.06, END: 600 };
const OUT_KEYS = [[0, 2], [150, -8], [300, -14], [420, -12], [510, 0], [600, 10]];
const psat = t => 6.112 * Math.exp(17.62 * t / (243.12 + t));
const rhFromAh = (ah, t) => ah * (273.15 + t) / 216.7 / psat(t) * 100;
const ahFromRh = (rh, t) => 216.7 * rh / 100 * psat(t) / (273.15 + t);
function tOut(m) {
  for (let i = 1; i < OUT_KEYS.length; i++) {
    const [a, ta] = OUT_KEYS[i - 1], [b, tb] = OUT_KEYS[i];
    if (m <= b) return ta + (tb - ta) * (m - a) / (b - a);
  }
  return OUT_KEYS[OUT_KEYS.length - 1][1];
}
let room, cmp, hist, running = false;
function resetRoom() {
  const ws0 = P.T_IN - P.F0 * (P.T_IN - tOut(0));
  room = { t: 0, ws0, phi: 0, ah: ahFromRh(35, P.T_IN) };
  cmp = { ws0, ah: room.ah, h: false, risk: 0 };
  hist = [];
}
const wallT = () => room.ws0 + room.phi * P.G_FAN * (P.T_IN - room.ws0);
const cmpSrh = () => rhFromAh(cmp.ah, P.T_IN) * psat(P.T_IN) / psat(cmp.ws0);
function advance(minutes, humid, fan) {
  const n = 10, dt = minutes / n;
  for (let i = 0; i < n; i++) {
    const teq = P.T_IN - P.F0 * (P.T_IN - tOut(room.t));
    room.ws0 += (teq - room.ws0) / P.TAU_WALL * dt;
    room.phi = Math.min(1, Math.max(0, room.phi + ((fan ? 1 : 0) - room.phi) / P.TAU_FAN * dt));
    room.ah += (P.G_HUM * humid + P.S_OCC - (room.ah - P.AH_OUT) / P.TAU_VENT) * dt;
    /* 비교용: 실내 60%만 맞추는 일반 가습기, 선풍기 없음 */
    cmp.ws0 += (teq - cmp.ws0) / P.TAU_WALL * dt;
    cmp.h = rhFromAh(cmp.ah, P.T_IN) < 60;
    cmp.ah += (P.G_HUM * cmp.h + P.S_OCC - (cmp.ah - P.AH_OUT) / P.TAU_VENT) * dt;
    if (cmpSrh() >= 80) cmp.risk += dt;
    room.t += dt;
  }
}

/* ---------- 보드 미연결일 때만 쓰는 같은 판단 로직 (decision.c와 동일) ---------- */
const local = {};
function resetLocal() { Object.assign(local, { h: false, f: false, meas: false, gain: 0, last: -1, fanOnT: 0, wallBefore: 0, risk: 0, prev: null, prevWnf: 0, slope: 0 }); }
function localStep(t, rt, rh, wt) {
  const L = local, dt = L.prev === null || t < L.prev ? 0 : t - L.prev;
  const evt = why => onEvt(`EVT t=${t.toFixed(1)} humid=${+L.h} fan=${+L.f} why=${why}`);
  if (L.f && L.meas && t - L.fanOnT >= 3 && (wt - L.wallBefore >= 0.5 || t - L.fanOnT >= 15)) {
    L.gain = Math.max(0, wt - L.wallBefore); L.meas = false; onEvt(`EVT t=${t.toFixed(1)} learn fan_gain=${L.gain.toFixed(2)}`);
  }
  const wnf = L.f ? wt - L.gain : wt;
  const srh = rh * psat(rt) / psat(wt), ah = ahFromRh(rh, rt);
  if (dt > 0 && !(L.f && L.meas)) L.slope = 0.8 * L.slope + 0.2 * (wnf - L.prevWnf) / dt;
  L.prevWnf = wnf; L.prev = t;
  const lg = Math.log(rh / 80 * psat(rt) / 6.112), crit = 243.12 * lg / (17.62 - lg);
  const eta = wnf <= crit ? 0 : L.slope < -0.001 ? (wnf - crit) / -L.slope : -1;
  if (srh >= 80) L.risk += dt;
  const held = t - L.last >= 1;
  const srhTgtNf = Math.max(rh, rhFromAh(8, rt)) * psat(rt) / psat(wnf);
  const set = (h, f, why) => { L.h = h; L.f = f; L.last = t; evt(why); };
  if (L.h && srh >= 75) set(false, L.f, 'srh>=75 humid_off');
  else if (!L.f && srh >= 75) { L.fanOnT = t; L.wallBefore = wt; L.meas = true; set(L.h, true, 'srh>=75 fan_on'); }
  else if (L.f && !L.meas && held && srhTgtNf < 70) set(L.h, false, 'srh_nofan<70 fan_off');
  else if (!L.h && held && ah < 6.5 && srh < 70) set(true, L.f, L.f ? 'ah<6.5 humid_on band_by_fan' : 'ah<6.5 humid_on');
  else if (L.h && ah >= 8) set(false, L.f, 'ah>=8 humid_off');
  const hi = w => 80 * psat(w) / psat(rt);
  return { t, rh, wt, srh, ah, humid: +L.h, fan: +L.f, lo: rhFromAh(6, rt), hi: hi(wt), hinf: hi(wnf), eta, risk: L.risk, gain: L.gain };
}

/* ---------- 보드 연결 (Web Serial) ---------- */
let port, writer, dk = false, lastVal = null;
const VAL_KEYS = ['t', 'rh', 'wt', 'srh', 'ah', 'humid', 'fan', 'lo', 'hi', 'hinf', 'eta', 'risk', 'gain'];
const matter = { reports: 0, acks: 0, txMs: null, latency: null, lastAck: null, cmds: 0 };
function send(line) { if (writer) writer.write(new TextEncoder().encode(line + '\r')); }
$('conn').onclick = async () => {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    dk = true;
    $('conn').classList.add('on'); $('conn').textContent = '보드 연결됨';
    $('mode').textContent = '보드가 판단 중'; $('mode').classList.add('board');
    send('shell echo off');
    doReset();
    readLoop();
  } catch (e) { addLog(e.name === 'NotFoundError' ? '포트 선택을 취소했습니다' : '포트 연결 실패: ' + e.message, 'app'); }
};
async function readLoop() {
  const r = port.readable.pipeThrough(new TextDecoderStream()).getReader();
  let buf = '';
  while (true) {
    const { value, done } = await r.read();
    if (done) break;
    buf += value;
    let k;
    while ((k = buf.indexOf('\n')) >= 0) { handle(buf.slice(0, k).trim()); buf = buf.slice(k + 1); }
  }
}
const devMs = l => { const m = l.match(/[IDEW]: (\d+) \[/); return m ? +m[1] : null; };
function handle(l) {
  const i = l.indexOf('VAL ');
  if (i >= 0) {
    const v = {};
    l.slice(i + 4).split(' ').forEach(p => { const [a, b] = p.split('='); if (b !== undefined) v[a] = parseFloat(b); });
    /* 로그와 섞여 잘린 줄은 버린다 */
    if (VAL_KEYS.every(k => Number.isFinite(v[k]))) lastVal = v;
    return;
  }
  const j = l.indexOf('EVT ');
  if (j >= 0) { onEvt(l.slice(j)); return; }
  /* Matter: 노드 → 허브 상태 보고와 허브의 수신 확인 */
  if (l.includes('(IM:ReportData)')) { matter.reports++; matter.txMs = devMs(l); renderMatter(); sendPacket(); }
  else if (l.includes('Received status response, status is 0x00')) {
    matter.acks++; const ms = devMs(l);
    if (ms !== null && matter.txMs !== null && ms >= matter.txMs) matter.latency = ms - matter.txMs;
    matter.lastAck = new Date(); renderMatter(true);
  } else if (/\(IM:(InvokeCommandRequest|WriteRequest)\)/.test(l)) { matter.cmds++; renderMatter(); }
}
function renderMatter(flash) {
  const s = $('m-stat');
  let txt = `허브 보고 ${matter.reports}회, 수신 확인 ${matter.acks}회`;
  if (matter.latency !== null) txt += `, 응답 ${matter.latency}ms`;
  if (matter.cmds) txt += `, 앱 명령 ${matter.cmds}회`;
  s.textContent = txt;
  s.setAttribute('fill', '#2997ff');
  if (flash) { s.setAttribute('fill', '#ffffff'); setTimeout(() => s.setAttribute('fill', '#2997ff'), 600); }
}
function sendPacket() {
  const p = $('m-packet');
  p.setAttribute('opacity', 1);
  $('m-anim').beginElement();
  setTimeout(() => p.setAttribute('opacity', 0), 700);
}

/* ---------- 노드의 판단: 노드가 보낸 이유를 짧은 문장으로 ---------- */
const REASONS = [
  ['band_by_fan', '선풍기로 넓힌 구간에서 가습 재개', 'humid'],
  ['srh>=75 humid_off', '벽 표면 75% → 가습 정지', 'humid'],
  ['srh>=75 fan_on', '벽 표면 75% → 선풍기로 벽 데움', 'fan'],
  ['srh_nofan<70 fan_off', '선풍기 없이도 안전 → 선풍기 정지', 'fan'],
  ['ah<6.5 humid_on', '절대습도 부족 → 가습 시작', 'humid'],
  ['ah>=8 humid_off', '절대습도 충분 → 가습 정지', 'humid'],
  ['app_manual', '앱 조작 → 30분 사용자 우선', 'app'],
];
const decisions = [];
function onEvt(e) {
  const t = parseFloat((e.match(/t=([\d.]+)/) || [])[1]);
  const when = Number.isFinite(t) ? clockText(t) : '';
  const g = e.match(/learn fan_gain=([\d.]+)/);
  if (g) { addLog(`선풍기 효과 학습: 벽 +${(+g[1]).toFixed(1)}℃`, 'fan', when); return; }
  const why = (e.match(/why=(.*)$/) || [])[1] || '';
  if (why === 'reset' || why === 'boot') return;
  const r = REASONS.find(([k]) => why.includes(k));
  addLog(r ? r[1] : why, r ? r[2] : '', when);
}
function addLog(text, cls, when) {
  decisions.unshift({ text: (when ? when + '   ' : '') + text });
  decisions.length = Math.min(decisions.length, 4);
  decisions.forEach((d, i) => { $('d' + i).textContent = d.text; });
  for (let i = decisions.length; i < 4; i++) $('d' + i).textContent = '';
}

/* ---------- 장면 ---------- */
function clockText(m) {
  const x = 22 * 60 + Math.round(m);
  return String(Math.floor(x / 60) % 24).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
}
const minText = m => m < 60 ? `${Math.round(m)}분` : `${Math.floor(m / 60)}시간 ${Math.round(m % 60)}분`;
const surfColor = s => s >= 80 ? '#ff453a' : s >= 75 ? '#ff9f0a' : s >= 70 ? '#ffd60a' : s >= 60 ? '#64d2ff' : '#5e8fb3';
const srhColor = s => s >= 80 ? '#ff453a' : s >= 75 ? '#ff9f0a' : '#2997ff';
const BX = p => 384 + 634 * (Math.min(Math.max(p, 20), 70) - 20) / 50;
const CX = m => 380 + 1100 * m / P.END, CY = p => 862 - (Math.min(Math.max(p, 20), 100) - 20) * 1.2; /* 100% 위는 결로: 물로 맺혀 100%에 머묾 */

/* 그래프 선 끝에 이름표 (범례 대신) */
function labelLines() {
  const last = hist[hist.length - 1];
  const items = [['cl-cmp', last && last.csrh >= 100 ? '일반 가습기: 결로' : '일반 가습기', last && last.csrh], ['cl-srh', '벽 표면', last && last.srh], ['cl-rh', '실내', last && last.rh]];
  if (!last) { items.forEach(([id]) => { $(id).textContent = ''; }); return; }
  const x = CX(last.t) + 8;
  const ys = items.map(([, , v]) => CY(v) + 5).sort((a, b) => a - b);
  items.sort((a, b) => CY(a[2]) - CY(b[2]));
  let prev = -1e9;
  items.forEach(([id, name], i) => {
    const y = Math.max(ys[i], prev + 15);
    prev = y;
    const el = $(id); el.textContent = name; el.setAttribute('x', x); el.setAttribute('y', Math.min(Math.max(y, 752), 868));
  });
}

function render(v) {
  const to = tOut(room.t);
  $('clock').textContent = clockText(room.t);
  $('out').textContent = `바깥 ${to.toFixed(1)}℃`;
  $('v-out').textContent = `${to.toFixed(0)}℃`;

  /* 같은 방, 다른 습도 */
  $('v-srh').textContent = v.srh >= 100 ? '결로' : v.srh.toFixed(0) + '%';
  $('v-srh').setAttribute('fill', srhColor(v.srh));
  $('v-wall').textContent = `벽 표면 ${v.wt.toFixed(1)}℃, 정지선 75, 임계 80`;
  $('v-rh').textContent = v.rh.toFixed(0) + '%';
  $('v-ah').textContent = `절대습도 ${v.ah.toFixed(1)} g/㎥, 목표 6 이상`;
  $('r-surf').setAttribute('fill', surfColor(v.srh));
  $('drops').setAttribute('opacity', v.srh >= 95 ? 1 : 0);

  /* 표 3 */
  const ok = v.hi > v.lo;
  $('b-label').textContent = ok ? `${v.lo.toFixed(0)}~${v.hi.toFixed(0)}%` : '구간 없음';
  $('b-allowed').setAttribute('x', BX(v.lo));
  $('b-allowed').setAttribute('width', ok ? Math.max(0, BX(v.hi) - BX(v.lo)) : 0);
  const showNf = v.fan && v.hinf < v.hi;
  $('b-nofan').setAttribute('opacity', showNf ? 1 : 0);
  $('b-nofan').setAttribute('x', BX(v.lo));
  $('b-nofan').setAttribute('width', Math.max(0, BX(v.hinf) - BX(v.lo)));
  $('b-nofan-lbl').textContent = showNf ? `점선 = 선풍기 없으면 ~${v.hinf.toFixed(0)}%` : '';
  $('b-marker').setAttribute('x', BX(v.rh) - 2);

  /* 가전 */
  const sc = $('scene');
  sc.classList.toggle('fan-on', !!v.fan);
  sc.classList.toggle('hum-on', !!v.humid);
  $('l-fan').textContent = v.fan ? '선풍기 ON' : '선풍기 OFF';
  $('l-fan').setAttribute('fill', v.fan ? '#2997ff' : '#8e8e93');
  $('l-gain').textContent = v.gain > 0 ? `학습: 벽 표면 +${v.gain.toFixed(1)}℃` : '';
  $('l-hum').textContent = v.humid ? '가습기 ON' : '가습기 OFF';
  $('l-hum').setAttribute('fill', v.humid ? '#ffffff' : '#8e8e93');
  $('led1').setAttribute('fill', v.fan ? '#30d158' : '#1c3329');
  $('led2').setAttribute('fill', v.humid ? '#30d158' : '#1c3329');
  $('led3').setAttribute('fill', v.srh >= 80 ? '#30d158' : '#1c3329');

  /* Matter 엔드포인트: 노드가 Matter 속성으로 게시하는 값 */
  $('ep1').textContent = v.fan ? 'ON' : 'OFF';
  $('ep5').textContent = v.humid ? 'ON' : 'OFF';
  $('ep2').textContent = Math.min(v.srh, 100).toFixed(1) + '%';
  $('ep3').textContent = v.rh.toFixed(1) + '%';
  $('ep4').textContent = v.wt.toFixed(2) + '℃';

  /* 밤새 기록 */
  $('v-risk').textContent = minText(v.risk);
  $('v-crisk').textContent = minText(cmp.risk);
  $('v-eta').textContent = v.eta < 0 ? '추세 안정' : v.eta === 0 ? '선풍기 없으면 임계' : `약 ${minText(v.eta)}`;
  const pts = key => hist.map(p => `${CX(p.t).toFixed(1)},${CY(p[key]).toFixed(1)}`).join(' ');
  $('c-rh').setAttribute('points', pts('rh'));
  $('c-srh').setAttribute('points', pts('srh'));
  $('c-cmp').setAttribute('points', pts('csrh'));
  labelLines();
  const runs = []; let start = null;
  hist.forEach(p => { if (p.fan && start === null) start = p.t; if (!p.fan && start !== null) { runs.push([start, p.t]); start = null; } });
  if (start !== null) runs.push([start, room.t]);
  $('c-fan').innerHTML = runs.map(([a, b]) => `<rect x="${CX(a).toFixed(1)}" y="742" width="${(CX(b) - CX(a)).toFixed(1)}" height="120"/>`).join('');
}

/* ---------- 0.5초마다: 가상 침실 → 센서값 → 노드 판단 → 다시 가상 침실 ---------- */
function tick() {
  const v = dk ? lastVal : null;
  const humid = v ? v.humid : local.h, fan = v ? v.fan : local.f;
  if (running) {
    advance(parseFloat($('speed').value) * 0.5, humid, fan);
    if (room.t >= P.END) { running = false; $('play').textContent = '▶ 한파의 밤'; }
  }
  const rh = rhFromAh(room.ah, P.T_IN), wt = wallT();
  let shown;
  if (dk) {
    send(`sim ${P.T_IN.toFixed(1)} ${rh.toFixed(1)} ${wt.toFixed(2)} 50 ${room.t.toFixed(1)}`);
    if (!lastVal) return;
    shown = lastVal;
  } else {
    shown = localStep(room.t, P.T_IN, rh, wt);
  }
  if (running || !hist.length) hist.push({ t: room.t, rh, srh: shown.srh, csrh: cmpSrh(), fan: shown.fan });
  render(shown);
}
function doReset() {
  running = false; $('play').textContent = '▶ 한파의 밤';
  resetRoom(); resetLocal();
  lastVal = null;
  decisions.length = 0; for (let i = 0; i < 4; i++) $('d' + i).textContent = '';
  send('dreset');
}
$('play').onclick = () => {
  if (room.t >= P.END) doReset();
  running = !running;
  $('play').textContent = running ? '❚❚ 멈춤' : '▶ 한파의 밤';
};
$('reset').onclick = doReset;
resetRoom(); resetLocal();
setInterval(tick, 500);
</script>
